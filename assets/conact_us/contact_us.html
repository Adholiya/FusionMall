<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  
  <style>
    /* CSS for styling the form */
    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 14px;
      color: #777;
    }

    .field input {
      display: block;
      width: 100%;
      padding: 10px;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 5px;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box;
    }

    input[type="submit"] {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background-color: #4460AA;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #33538B;
    }

    /* Styling for the form container */
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f7f7f7;
      margin: 0;
    }

    form {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <form id="form">
    <h1>Contact Us</h1>
    <div class="field">
      <label for="user_name">User Name</label>
      <input type="text" name="user_name" id="user_name" required>
    </div>
    <div class="field">
      <label for="user_message">Message</label>
      <input type="text" name="user_message" id="user_message" required>
    </div>
    <div class="field">
      <label for="user_subject">Subject</label>
      <input type="text" name="user_subject" id="user_subject" required>
    </div>
    <div class="field">
      <label for="user_email">Email</label>
      <input type="email" name="user_email" id="user_email" required>
    </div>

    <input type="submit" id="button" value="Send Email">
  </form>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script type="text/javascript">
    emailjs.init('4SEdD8sMihD8As6Ia');  // Initialize with your EmailJS User ID

    const btn = document.getElementById('button');

    document.getElementById('form').addEventListener('submit', function(event) {
      event.preventDefault();  // Prevent default form submission

      btn.value = 'Sending...';  // Change button text

      const serviceID = 'default_service';  // Replace with your EmailJS service ID
      const templateID = 'template_9pu23mr';  // Replace with your EmailJS template ID

      emailjs.sendForm(serviceID, templateID, this)
        .then(() => {
          btn.value = 'Send Email';  // Reset button text
          alert('Sent!');  // Notify user
        }, (err) => {
          btn.value = 'Send Email';  // Reset button text
          alert('Failed to send email: ' + JSON.stringify(err));  // Error handling
        });
    });
  </script>

</body>
</html>
